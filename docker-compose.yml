# Local stack for App 1.
#   docker compose up -d                   -> infra only (Postgres, Keycloak, LocalStack); run API + web from your IDE
#   docker compose --profile full up -d    -> everything, including the API and web containers
name: payroll

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 5s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always say iss=http://localhost:8180/... even when the API talks to keycloak:8080 internally
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8080"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30

  localstack:
    # Pinned: newer LocalStack images require an auth token; 4.9 is the last tokenless community build.
    image: localstack/localstack:4.9
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-southeast-1
    ports: ["4566:4566"]
    volumes: ["./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://payslips"]
      interval: 5s
      retries: 30

  api:
    profiles: ["full"]
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payroll
      OIDC_ISSUER: http://localhost:8180/realms/payroll
      OIDC_JWKS: http://keycloak:8080/realms/payroll/protocol/openid-connect/certs
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      CORS_ORIGINS: http://localhost:8081,http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      localstack: { condition: service_healthy }

  web:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_OIDC_AUTHORITY: http://localhost:8180/realms/payroll
        VITE_OIDC_CLIENT_ID: payroll-web
    ports: ["8081:80"]
    depends_on: [api]

volumes:
  pgdata:
